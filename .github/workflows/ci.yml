name: CI

on:
  push:
    branches: [main, development, "feature/**"]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the smoke run has real commits to read

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Smoke run (gitpulse on its own repo)
        shell: bash
        run: |
          set -x  # log each command, so a failure shows which one
          # --no-launch-profile: otherwise dotnet run prints "Using launch settings from ..." to stdout.
          gp() { dotnet run --project src/GitPulse --configuration Release --no-build --no-launch-profile -- "$@"; }
          gp                      # default command: prints the overview when not interactive
          gp scan
          gp authors --top 5
          gp hotspots --top 5
          gp heatmap
          gp commit HEAD
          gp commit HEAD~1 --no-diff
          # dates from the repo's own history, so the check doesn't depend on the runner's clock
          since=$(git log -1 --format=%cs HEAD~1)
          gp authors --since "$since" --until 2099-12-31 --author a
          # --raw must be valid JSON and nothing else
          gp commit HEAD --raw > "$RUNNER_TEMP/commit.json"
          pwsh -NoProfile -Command "Get-Content -Raw '$RUNNER_TEMP/commit.json' | ConvertFrom-Json | Out-Null"
          gp report --html "$RUNNER_TEMP/report.html"
          grep -q "<!doctype html>" "$RUNNER_TEMP/report.html"
          # expected failures must exit non-zero
          if gp report --html "$RUNNER_TEMP/report.html"; then echo "overwrite without --force should fail"; exit 1; fi
          if gp watch; then echo "watch without a terminal should fail"; exit 1; fi
          if gp authors --top 0; then echo "--top 0 should fail"; exit 1; fi
          if gp overview --path "$RUNNER_TEMP"; then echo "non-repo should fail"; exit 1; fi

      - name: Pack, install and run the dotnet tool
        shell: bash
        run: |
          set -x
          dotnet pack src/GitPulse --configuration Release --no-build --output "$RUNNER_TEMP/packages"
          dotnet tool install GitPulse --tool-path "$RUNNER_TEMP/tools" --add-source "$RUNNER_TEMP/packages" --version "$(dotnet msbuild src/GitPulse -getProperty:Version)"
          "$RUNNER_TEMP/tools/gitpulse" --version
          "$RUNNER_TEMP/tools/gitpulse" scan --no-cache
          "$RUNNER_TEMP/tools/gitpulse" overview --no-color

      - name: Upload the package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: gitpulse-package
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error
